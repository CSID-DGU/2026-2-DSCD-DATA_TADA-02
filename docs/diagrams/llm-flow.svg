<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110">
<rect width="100%" height="100%" fill="#f3f9fc"/>
<text x="50" y="66" font-family="Malgun Gothic, sans-serif" font-size="36" font-weight="700" fill="#0a1f43">페이지별 LLM 해설 실행 흐름</text>
<text x="50" y="105" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">고정된 서버 처리 순서입니다. 스스로 조사 도구를 선택하는 AI 에이전트는 현재 필요하지 않습니다.</text>
<rect x="50" y="160" width="400" height="135" rx="15" fill="white" stroke="#cbdce7" stroke-width="2"/>
<text x="72" y="201" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#0a1f43">1. 현재 페이지 표시</text>
<text x="72" y="241" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">지표/차트를 먼저 조회</text>
<text x="72" y="272" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">비교는 선택 후보 전체 1~5개</text>
<rect x="600" y="160" width="400" height="135" rx="15" fill="white" stroke="#cbdce7" stroke-width="2"/>
<text x="622" y="201" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#0a1f43">2. 근거 구성</text>
<text x="622" y="241" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">페이지, 분기, 조건과 수치</text>
<text x="622" y="272" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">자료/모델/프롬프트 버전</text>
<rect x="1150" y="160" width="400" height="135" rx="15" fill="white" stroke="#cbdce7" stroke-width="2"/>
<text x="1172" y="201" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#0a1f43">3. DB 캐시 확인</text>
<text x="1172" y="241" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">근거와 설정의 해시로 조회</text>
<text x="1172" y="272" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">완료 결과 또는 생성 잠금</text>
<polyline points="450,225 600,225" fill="none" stroke="#009da5" stroke-width="3"/>
<polygon points="600,225 588.2941876694152,230.654551943446 588.2941876694152,219.345448056554" fill="#009da5"/>
<rect x="465" y="190" width="86" height="21" fill="#f3f9fc"/>
<text x="470" y="204" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#009da5">해설 POST</text>
<polyline points="1000,225 1150,225" fill="none" stroke="#009da5" stroke-width="3"/>
<polygon points="1150,225 1138.2941876694151,230.654551943446 1138.2941876694151,219.345448056554" fill="#009da5"/>
<rect x="1035" y="190" width="64" height="21" fill="#f3f9fc"/>
<text x="1040" y="204" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#009da5">캐시 키</text>
<rect x="1150" y="390" width="400" height="165" rx="15" fill="white" stroke="#cbdce7" stroke-width="2"/>
<text x="1172" y="431" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#0a1f43">4. 캐시 미적중이면 생성</text>
<text x="1172" y="471" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">완료까지 HTTP 요청 유지</text>
<text x="1172" y="502" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">동시 호출 제한과 timeout</text>
<text x="1172" y="533" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">다른 동일 요청은 202로 대기</text>
<polyline points="1350,295 1350,390" fill="none" stroke="#009da5" stroke-width="3"/>
<polygon points="1350,390 1344.345448056554,378.2941876694152 1355.654551943446,378.2941876694152" fill="#009da5"/>
<rect x="1365" y="329" width="58" height="21" fill="#f3f9fc"/>
<text x="1370" y="343" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#009da5">미적중</text>
<rect x="600" y="390" width="400" height="165" rx="15" fill="white" stroke="#cbdce7" stroke-width="2"/>
<text x="622" y="431" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#0a1f43">5. LLM provider</text>
<text x="622" y="471" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">정해진 근거로 구조화 응답</text>
<text x="622" y="502" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">모델명 교체 가능</text>
<text x="622" y="533" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">현재는 실제 유료 호출 없음</text>
<polyline points="1150,470 1000,470" fill="none" stroke="#009da5" stroke-width="3"/>
<polygon points="1000,470 1011.7058123305848,464.345448056554 1011.7058123305848,475.654551943446" fill="#009da5"/>
<rect x="1023" y="435" width="80" height="21" fill="#f3f9fc"/>
<text x="1028" y="449" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#009da5">근거 전송</text>
<rect x="50" y="390" width="400" height="165" rx="15" fill="white" stroke="#cbdce7" stroke-width="2"/>
<text x="72" y="431" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#0a1f43">6. 결과 검증</text>
<text x="72" y="471" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">응답 형식과 근거 ID 검사</text>
<text x="72" y="502" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">의미/숫자 품질 평가는 별도</text>
<text x="72" y="533" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">유효한 완료 결과만 DB 저장</text>
<polyline points="600,470 450,470" fill="none" stroke="#009da5" stroke-width="3"/>
<polygon points="450,470 461.7058123305848,464.345448056554 461.7058123305848,475.654551943446" fill="#009da5"/>
<rect x="470" y="435" width="80" height="21" fill="#f3f9fc"/>
<text x="475" y="449" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#009da5">생성 결과</text>
<rect x="50" y="665" width="400" height="165" rx="15" fill="white" stroke="#cbdce7" stroke-width="2"/>
<text x="72" y="706" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#0a1f43">7. 하단 해설 표시</text>
<text x="72" y="746" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">다시 방문하면 캐시 재사용</text>
<text x="72" y="777" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">카드 화살표 이동은 재호출 안 함</text>
<text x="72" y="808" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">다른 페이지는 처음 열 때 생성</text>
<polyline points="250,555 250,665" fill="none" stroke="#009da5" stroke-width="3"/>
<polygon points="250,665 244.345448056554,653.2941876694152 255.654551943446,653.2941876694152" fill="#009da5"/>
<rect x="265" y="598" width="80" height="20" fill="#f3f9fc"/>
<text x="270" y="612" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#009da5">완료 응답</text>
<polyline points="1550,225 1580,225 1580,620 450,620 450,700" fill="none" stroke="#536a89" stroke-width="3"/>
<polygon points="450,700 444.345448056554,688.2941876694152 455.654551943446,688.2941876694152" fill="#536a89"/>
<rect x="945" y="587" width="232" height="21" fill="#f3f9fc"/>
<text x="950" y="601" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#536a89">캐시 적중: LLM 호출 없이 반환</text>
<rect x="600" y="665" width="400" height="165" rx="15" fill="#fff5ec" stroke="#cbdce7" stroke-width="2"/>
<text x="622" y="706" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#0a1f43">오류 / 비활성 / 자료 없음</text>
<text x="622" y="746" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">실패 상태와 안내 표시</text>
<text x="622" y="777" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">기본 지표와 차트는 계속 사용</text>
<text x="622" y="808" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">실패 결과를 완료 캐시에 넣지 않음</text>
<polyline points="800,555 800,665" fill="none" stroke="#d5783b" stroke-width="3"/>
<polygon points="800,665 794.345448056554,653.2941876694152 805.654551943446,653.2941876694152" fill="#d5783b"/>
<rect x="815" y="598" width="166" height="21" fill="#f3f9fc"/>
<text x="820" y="612" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#d5783b">거부 / 오류 / timeout</text>
<rect x="1150" y="665" width="400" height="165" rx="15" fill="white" stroke="#cbdce7" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1172" y="706" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#0a1f43">후속 관측과 실험</text>
<text x="1172" y="746" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">요청 ID로 서버와 LLM 연결</text>
<text x="1172" y="777" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">모델/프롬프트/토큰/시간 기록</text>
<text x="1172" y="808" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">동일 평가셋으로 품질 비교</text>
<rect x="50" y="910" width="1500" height="140" rx="15" fill="white" stroke="#cbdce7" stroke-width="2"/>
<text x="72" y="951" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#0a1f43">현재와 후속 범위</text>
<text x="72" y="991" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">현재: 근거 구성, 기본 provider 경계, 캐시/잠금, 모의 실패 테스트, 서버 응답시간 기록</text>
<text x="72" y="1022" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#536a89">후속: 실제 LLM 품질 평가, Langfuse와 OpenTelemetry 연결. 에이전트는 자유 질문/동적 도구 선택이 필요할 때 검토</text>
</svg>